# Administrator-installed loopback-only TLS probe. Include inside http {}.
# Use the SAME certificate, canonical Host, document root and dedicated FPM
# socket as the public site. Never expose this listener via the front proxy.
server {
    listen 127.0.0.1:8443 ssl;
    server_name example.com;
    ssl_certificate /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;
    root /var/www/cajeer-lite/public;
    access_log off;
    location = /health/ready {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_cache off;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location / { return 404; }
}
