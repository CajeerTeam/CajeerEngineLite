# Install as a root-owned systemd drop-in for EACH managed .service (not .timer).
[Service]
ExecCondition=/usr/local/sbin/cajeer-maintenance guard
# Adapt both paths to the canonical site root. Keep only storage writable.
# Add separate socket/session paths if the dedicated FPM service needs them.
ReadOnlyPaths=/srv/cajeer /srv/cajeer/storage/app/updates
ReadWritePaths=/srv/cajeer/storage
NoNewPrivileges=yes
