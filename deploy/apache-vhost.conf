# CajeerEngine Lite 1.4.6: Apache 2.4 + PHP-FPM (mod_ssl, mod_rewrite, mod_proxy_fcgi).
# Replace the certificate, domain, document root and FPM socket before enabling.
<VirtualHost *:443>
    ServerName example.com
    DocumentRoot "/var/www/cajeer-lite/public"
    # Root-owned persistent gate, before any PHP or static asset routing.
    RewriteEngine On
    RewriteCond /var/lib/cajeer-maintenance/active -f
    RewriteRule ^ - [R=503,L]
    SSLEngine on
    SSLCertificateFile "/etc/ssl/example.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/ssl/example.com/privkey.pem"
    Header always set Strict-Transport-Security "max-age=31536000"
    <Directory "/var/www/cajeer-lite/public">
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews -FollowSymLinks
        RewriteEngine On
        RewriteRule ^assets/[A-Za-z0-9_-]+\.(css|js|png|jpg|jpeg|webp|ico)$ - [END]
        RewriteRule ^ index.php [END]
    </Directory>
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    <FilesMatch "(?i)^(?!index\.php$).*\.php$">
        Require all denied
    </FilesMatch>
    ProxyFCGISetEnvIf "true" HTTPS "on"
    ErrorLog "${APACHE_LOG_DIR}/cajeer-error.log"
    CustomLog "${APACHE_LOG_DIR}/cajeer-access.log" combined
</VirtualHost>
