# CajeerEngine Lite 1.4.6: origin web server behind a TLS-terminating proxy.
# NOT an Internet-facing example: firewall the origin and replace the allow IP.
# The front proxy MUST overwrite Host, X-Forwarded-Host and X-Forwarded-Proto;
# NEVER append user-provided values. Set CAJEER_TRUSTED_PROXY_IPS to the
# literal IP address seen in REMOTE_ADDR (the front proxy IP).
server {
    listen 127.0.0.1:8081;
    server_name example.com;
    root /var/www/cajeer-lite/public;
    index index.php;
    client_max_body_size 10m;
    allow 127.0.0.1; # REPLACE with the front proxy's source IP
    deny all;
    location ~ ^/assets/[A-Za-z0-9_-]+\.(css|js|png|jpg|jpeg|webp|ico)$ { try_files $uri =404; }
    location / { rewrite ^ /index.php last; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS off; # ONLY validated trusted proxy headers can elevate to HTTPS.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
