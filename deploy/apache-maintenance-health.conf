# Include once in the root-owned Apache config. Do NOT forward public traffic
# to this listener. Same TLS identity, DocumentRoot and FPM socket as the site.
Listen 127.0.0.1:8443 https
<VirtualHost 127.0.0.1:8443>
    ServerName example.com
    DocumentRoot "/var/www/cajeer-lite/public"
    SSLEngine on
    SSLCertificateFile "/etc/ssl/example.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/ssl/example.com/privkey.pem"
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$ [OR]
    RewriteCond %{REQUEST_URI} !^/health/ready$
    RewriteRule ^ - [R=404,L]
    <Directory "/var/www/cajeer-lite/public">
        AllowOverride None
        Options -Indexes -MultiViews -FollowSymLinks
        Require local
    </Directory>
    <LocationMatch "^/health/ready$">
        Require local
    </LocationMatch>
    ProxyPassMatch "^/health/ready$" "unix:/run/php/php8.4-fpm.sock|fcgi://localhost/var/www/cajeer-lite/public/index.php"
    ProxyFCGISetEnvIf "true" HTTPS "on"
</VirtualHost>
