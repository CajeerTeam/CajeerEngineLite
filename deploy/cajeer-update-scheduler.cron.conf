# /etc/cron.d/cajeer-update-scheduler (root-owned 0644)
# Edit identity, root and repository/key for this installation. Do not enable
# this alongside the systemd timer or the legacy `update auto run` cron job.
SHELL=/bin/sh
PATH=/usr/bin:/bin
CAJEER_UPDATE_CONTROL_WORKER=1
CAJEER_AUTO_UPDATE_GITHUB_REPO=CajeerTeam/CajeerEngineLite
CAJEER_UPDATE_TRUSTED_KEY_FILE=/etc/cajeer/update-trusted.pem
CAJEER_AUTO_UPDATE_ENABLED=0
CAJEER_AUTO_UPDATE_INSTALL=0
CAJEER_AUTO_UPDATE_WORKERS_QUIESCED=0
* * * * * cajeer /usr/bin/timeout --kill-after=30s 10m /usr/bin/php /srv/cajeer/bin/cajeer update scheduler tick
