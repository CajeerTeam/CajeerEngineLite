# Install as /etc/cajeer/maintenance.env, root:root 0600.
# Dedicated site user and FPM service, NOT a shared multi-site FPM instance.
CAJEER_MAINTENANCE_ROOT=/srv/cajeer
CAJEER_MAINTENANCE_USER=cajeer
CAJEER_MAINTENANCE_FPM_UNIT=cajeer-php-fpm.service
CAJEER_MAINTENANCE_BACKGROUND_UNITS=""
CAJEER_AUTO_UPDATE_GITHUB_REPO=CajeerTeam/CajeerEngineLite
CAJEER_UPDATE_TRUSTED_KEY_FILE=/etc/cajeer/update-trusted.pem
CAJEER_AUTO_UPDATE_WINDOW_UTC=02:00-04:00
CAJEER_AUTO_UPDATE_ENABLED=0
CAJEER_AUTO_UPDATE_INSTALL=0
CAJEER_AUTO_UPDATE_ALLOW_PREVIEW_INSTALL=0
