name: Signed Lite release
# Protected version tags or manual dispatch; never on an untrusted PR.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Exact previous release tag (e.g. v1.4.7)'
        required: true
        type: string
      extra_base_tags:
        description: 'Optional additional exact base tags, space separated (max 15)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cajeer-official-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      base_tag: ${{ steps.versions.outputs.base_tag }}
      base_sha: ${{ steps.versions.outputs.base_sha }}
      target_sha: ${{ steps.versions.outputs.target_sha }}
      extra_shas: ${{ steps.versions.outputs.extra_shas }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact version and ancestry
        id: versions
        env:
          BASE_TAG: ${{ inputs.base_tag }}
          TARGET_TAG: ${{ github.ref_name }}
          TARGET_REF: ${{ github.ref }}
          EXTRA_TAGS: ${{ inputs.extra_base_tags }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pattern='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$TARGET_REF" == refs/tags/* && "$TARGET_TAG" =~ $pattern ]]
          if [[ "$EVENT_NAME" == push ]]; then
            BASE_TAG=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | python3 tests/release_publication_158.py base --target "$TARGET_TAG")
          fi
          [[ "$BASE_TAG" =~ $pattern ]]
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          [[ "$(cat VERSION)" == "${TARGET_TAG#v}" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$TARGET_TAG^{commit}")" ]]
          [[ "$(git show "refs/tags/$BASE_TAG:VERSION")" == "${BASE_TAG#v}" ]]
          if [[ "${TARGET_TAG#v}" == 1.5.0 ]]; then [[ "${BASE_TAG#v}" == 1.4.8 ]]; fi
          git merge-base --is-ancestor "refs/tags/$BASE_TAG" HEAD
          [[ "$(git rev-parse "refs/tags/$BASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]
          echo "base_sha=$(git rev-parse "refs/tags/$BASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          read -r -a tags <<< "$EXTRA_TAGS"
          # GA must include the exact RC base even when its release is Preview.
          # Include available 1.5.7/1.5.8 tags as additional supported bases.
          if [[ "${TARGET_TAG#v}" == 1.6.0 ]]; then
            [[ "$TARGET_TAG" == v1.6.0 ]] || { echo 'GA requires canonical v1.6.0 tag' >&2; exit 1; }
            for v in 1.5.7 1.5.8 1.5.9; do
              tag="v$v"
              if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                tag="$v"
                if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                  [[ "$v" != 1.5.9 ]] || { echo 'GA requires exact 1.5.9 source tag' >&2; exit 1; }
                  continue
                fi
              fi
              [[ "${BASE_TAG#v}" != "$v" ]] || continue
              present=0
              for supplied in "${tags[@]}"; do [[ "${supplied#v}" != "$v" ]] || present=1; done
              if [[ "$present" == 0 ]]; then tags+=("$tag"); fi
            done
          fi
          [[ ${#tags[@]} -le 15 ]]
          shas=()
          for tag in "${tags[@]}"; do
            [[ "$tag" =~ $pattern && "$tag" != "$BASE_TAG" ]]
            [[ "$(git show "refs/tags/$tag:VERSION")" == "${tag#v}" ]]
            git merge-base --is-ancestor "refs/tags/$tag" HEAD
            shas+=("$(git rev-parse "refs/tags/$tag^{commit}")")
          done
          echo "extra_shas=${shas[*]}" >> "$GITHUB_OUTPUT"
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
  rehearsal:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install exact tag pair with disposable key
        env:
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          EXTRA_SHAS: ${{ needs.validate.outputs.extra_shas }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/base" "$work/next"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git archive "$BASE_SHA" | tar -x -C "$work/base"
          git archive "$TARGET_SHA" | tar -x -C "$work/next"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$work/test.pem"
          openssl pkey -in "$work/test.pem" -pubout -out "$work/trust.pem"
          read -r -a extra <<< "$EXTRA_SHAS"
          args=()
          for sha in "${extra[@]}"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            mkdir "$work/$sha"
            git archive "$sha" | tar -x -C "$work/$sha"
            args+=(--extra-base "$work/$sha")
          done
          python3 tests/release_distribution_152.py "${args[@]}" --base "$work/base" --candidate "$work/next" \
            --output "$work/result" --signing-key "$work/test.pem" --trusted-key "$work/trust.pem" \
            --base-commit "$BASE_SHA" --target-commit "$TARGET_SHA"
  sign:
    needs: [validate, ci, rehearsal]
    runs-on: ubuntu-latest
    # Configure required reviewers and protected tag deployment rules before use.
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sign and verify final artifacts
        env:
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          EXTRA_SHAS: ${{ needs.validate.outputs.extra_shas }}
          SIGNING_KEY: ${{ secrets.CAJEER_RELEASE_PRIVATE_KEY }}
          TRUSTED_KEY: ${{ vars.CAJEER_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          [[ -n "$SIGNING_KEY" && -n "$TRUSTED_KEY" ]]
          printf '%s\n' "$SIGNING_KEY" > "$work/private.pem"
          printf '%s\n' "$TRUSTED_KEY" > "$work/trust.pem"
          unset SIGNING_KEY TRUSTED_KEY
          mkdir "$work/base" "$work/next"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git archive "$BASE_SHA" | tar -x -C "$work/base"
          git archive "$TARGET_SHA" | tar -x -C "$work/next"
          read -r -a extra <<< "$EXTRA_SHAS"
          args=()
          for sha in "${extra[@]}"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            mkdir "$work/$sha"
            git archive "$sha" | tar -x -C "$work/$sha"
            args+=(--extra-base "$work/$sha")
          done
          python3 tests/release_distribution_152.py "${args[@]}" --base "$work/base" --candidate "$work/next" \
            --output "$RUNNER_TEMP/cajeer-release" --signing-key "$work/private.pem" --trusted-key "$work/trust.pem" \
            --base-commit "$BASE_SHA" --target-commit "$TARGET_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ github.run_id }}
          path: ${{ runner.temp }}/cajeer-release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [validate, sign]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-${{ github.run_id }}
          path: release
      - name: Verify signature and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ github.ref_name }}
          BASE_TAG: ${{ needs.validate.outputs.base_tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          TRUSTED_KEY: ${{ vars.CAJEER_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          [[ -n "$TRUSTED_KEY" ]]
          printf '%s\n' "$TRUSTED_KEY" > "$work/trust.pem"
          unset TRUSTED_KEY
          version=${TARGET_TAG#v}
          python3 tests/release_distribution_152.py --verify release --target "$version" --trusted-key "$work/trust.pem"
          cd release
          base=${BASE_TAG#v}
          openssl dgst -sha256 -verify "$work/trust.pem" -signature SHA256SUMS.sig SHA256SUMS
          diff -u <(printf '%s\n' "CajeerEngineLite-$version.cjrupdate" "CajeerEngineLite-$version.zip" release-report.json | sort) <(awk '{print $2}' SHA256SUMS | sort)
          sha256sum --strict -c SHA256SUMS
          jq -e --arg to "$version" --arg from "$base" --arg target_sha "$TARGET_SHA" --arg base_sha "$BASE_SHA" \
            '.to == $to and .from == $from and .target_commit == $target_sha and .base_commit == $base_sha and .production_accepted == false and (.runtime_files | type == "object")' release-report.json >/dev/null
          [[ -s "CajeerEngineLite-$version.cjrupdate" && -s "CajeerEngineLite-$version.zip" ]]
          # Resolve the immutable tag to its commit; annotated and lightweight tags work.
          [[ "$(gh api "repos/$GH_REPO/commits/$TARGET_TAG" --jq .sha)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$BASE_TAG" --jq .sha)" == "$BASE_SHA" ]]
          # Fail if any release for this tag exists; never overwrite an official asset.
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it manually.' >&2; exit 1
          fi
          release_flags=()
          if [[ "$version" == 1.4.9 || "$version" == 1.5.9 ]]; then release_flags+=(--prerelease --latest=false); fi
          gh release create "$TARGET_TAG" --verify-tag --draft "${release_flags[@]}" --title "CajeerEngine Lite $version" \
            --notes "Signed incremental update from $base, full clean-install ZIP, SHA-256 signature and automated rehearsal report. Production sign-off is separate." \
            ./*
          # Verify the actual GitHub-hosted draft, not just the local build.
          gh release view "$TARGET_TAG" --json isDraft --jq .isDraft | grep -Fx true
          mkdir "$work/downloaded"
          gh release download "$TARGET_TAG" --dir "$work/downloaded" --pattern '*'
          cd ..
          python3 tests/release_publication_158.py verify-draft --local release --remote "$work/downloaded" --trusted-key "$work/trust.pem" --target "$version"
          [[ "$(gh api "repos/$GH_REPO/commits/$TARGET_TAG" --jq .sha)" == "$TARGET_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$BASE_TAG" --jq .sha)" == "$BASE_SHA" ]]
          gh release view "$TARGET_TAG" --json isDraft --jq .isDraft | grep -Fx true
          if [[ "$version" == 1.4.9 || "$version" == 1.5.9 ]]; then
            # Release candidate stays out of the stable automatic-update channel.
            gh release edit "$TARGET_TAG" --prerelease --latest=false --draft=false
          else
            gh release edit "$TARGET_TAG" --draft=false
          fi
