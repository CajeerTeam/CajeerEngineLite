  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_103.py
      - run: python tests/browser_104.py
      - run: python tests/browser_105.py
      - run: python tests/browser_106.py
      - run: python tests/browser_107.py
      - run: python tests/browser_108.py
      - run: python tests/browser_109.py
      - run: python tests/browser_110.py
      - run: python tests/browser_122.py
      - run: python tests/browser_123.py
