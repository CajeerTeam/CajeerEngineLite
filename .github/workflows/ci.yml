name: Lite CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l bin/cajeer
      - run: node --check public/assets/consent.js
      - run: node --check public/assets/ga4.js
      - run: node --check public/assets/metrica.js
      - run: node --check public/assets/gtm.js
      - run: node --check public/assets/clarity.js
      - run: node --check public/assets/matomo.js
      - run: php tests/smoke.php
      - run: php tests/core_210.php
      - run: php tests/core_102.php
      - run: php tests/core_103.php
      - run: php tests/core_104.php
      - run: php tests/core_105.php
      - run: php tests/core_106.php
      - run: php tests/core_107.php
      - run: php tests/core_108.php
      - run: php tests/core_109.php
      - run: php tests/core_110.php
      - run: php tests/core_111.php
      - run: php tests/core_112.php
      - run: php tests/core_113.php
      - run: php tests/core_114.php
      - run: php tests/core_115.php
      - run: php tests/core_116.php
      - run: php tests/core_117.php
      - run: php tests/core_118.php
      - run: php tests/core_119.php
      - run: php tests/core_120.php
      - run: php tests/auth_concurrency_119.php
      - run: bash tests/auth_hardening_http.sh
      - run: bash tests/auth_acceptance_http.sh
      - run: bash tests/auth_release_http.sh
      - run: bash tests/auth_policy_http.sh
      - run: bash tests/recovery_cli.sh
      - run: bash tests/http.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_103.py
      - run: python tests/browser_104.py
      - run: python tests/browser_105.py
      - run: python tests/browser_106.py
      - run: python tests/browser_107.py
      - run: python tests/browser_108.py
      - run: python tests/browser_109.py
      - run: python tests/browser_110.py
