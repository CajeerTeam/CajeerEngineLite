      - run: python tests/browser_125.py
      - run: python tests/browser_126.py
      - run: python tests/browser_127.py
      - run: python tests/browser_129.py
      - run: python tests/browser_131.py
      - run: python tests/browser_132.py
      - run: python tests/browser_133.py
      - run: python tests/browser_134.py
      - run: python tests/browser_135.py
      - run: python tests/browser_136.py
      - run: python tests/browser_137.py
      - run: python tests/browser_138.py
      - run: python tests/browser_139.py
      - run: python tests/browser_140.py

  compatibility-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/browser_146.py --browser ${{ matrix.browser }}
  php-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php tests/core_146.php
      - run: php tests/core_147.php
      - run: php tests/core_144.php
      - run: php tests/core_145.php
      - run: php tests/core_151.php
      - run: php tests/core_152.php
      - run: php tests/core_153.php
      - run: bash tests/update_control_http_153.sh
      - run: bash tests/compatibility_http_146.sh
      - run: bash tests/operational_http_147.sh
      - run: python3 tests/operational_load_147.py --seconds 15 --workers 4
  webserver-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx apache2 openssl
      - run: bash tests/webservers_146.sh

  rc-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx openssl
      - run: python3 tests/rc_staging_149.py
      - run: python3 tests/production_stable_150.py
