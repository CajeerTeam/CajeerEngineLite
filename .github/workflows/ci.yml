      - run: php tests/core_114.php
      - run: php tests/core_115.php
      - run: php tests/core_116.php
      - run: php tests/core_117.php
      - run: php tests/core_118.php
      - run: php tests/core_119.php
      - run: php tests/core_120.php
      - run: php tests/core_121.php
      - run: php tests/core_122.php
      - run: php tests/core_123.php
      - run: php tests/core_124.php
      - run: php tests/core_125.php
      - run: php tests/core_126.php
      - run: php tests/core_127.php
      - run: php tests/core_128.php
      - run: php tests/ai_integration_129.php
      - run: php tests/ai_failures_129.php
      - run: php tests/core_130.php
      - run: php tests/core_131.php
      - run: php tests/core_132.php
      - run: php tests/core_133.php
      - run: php tests/core_134.php
